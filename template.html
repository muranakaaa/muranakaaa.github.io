<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{URL}}">
<meta property="og:image" content="{{URL}}{{OGP_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@{{HANDLE}}">
<style>
:root {
  color-scheme: light dark;
  --fg: #1f2328;
  --fg-muted: #59636e;
  --fg-accent: #0969da;
  --bg: #ffffff;
  --bg-muted: #f6f8fa;
  --border: #d1d9e0;
  --border-muted: #d1d9e0b3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --fg: #f0f6fc;
    --fg-muted: #9198a1;
    --fg-accent: #4493f8;
    --bg: #0d1117;
    --bg-muted: #151b23;
    --border: #3d444d;
    --border-muted: #3d444db3;
  }
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  color: var(--fg);
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  font-size: 16px;
  line-height: 1.5;
  overflow-wrap: break-word;
  line-break: strict;
  word-break: normal;
  word-break: auto-phrase;
  text-wrap: pretty;
}
a { color: var(--fg-accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: .2rem; }

.page { max-width: 980px; margin: 0 auto; padding: 15px; }
h1, h2, h3 { margin: 24px 0 16px; font-weight: 600; line-height: 1.25; }
h1 { font-size: 2em; padding-bottom: .3em; border-bottom: 1px solid var(--border-muted); margin-top: 0; }
h2 { font-size: 1.5em; padding-bottom: .3em; border-bottom: 1px solid var(--border-muted); }
h3 { font-size: 1.25em; }
p { margin: 0 0 16px; }
.tight { margin-bottom: 0; }
.role { display: inline-block; white-space: nowrap; }
.updated { color: var(--fg-muted); font-size: 14px; margin: 0 0 8px; }
.note { color: var(--fg-muted); }

@media (min-width: 768px) {
  .page { padding: 45px; }
}

a.card {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: 440px;
  margin: 0 0 16px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--fg);
  text-decoration: none;
}
a.card:hover { text-decoration: none; border-color: var(--fg-accent); }
a.card img { width: 64px; height: 64px; object-fit: contain; flex: none; border-radius: 6px; background: var(--bg-muted); }
.card-text { min-width: 0; }
.card-title, .card-desc, .card-domain { display: block; line-height: 1.4; }
.card-title { font-weight: 600; }
.card-desc { margin-top: 2px; color: var(--fg-muted); font-size: 14px; }
.card-domain { margin-top: 2px; color: var(--fg-muted); font-size: 12px; }

.posts { list-style: none; padding: 0; margin: 0; }
.posts li { margin: 0 0 24px; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
.shot { padding: 0; margin: 0; border: 0; background: none; cursor: zoom-in; line-height: 0; }
.shot img { width: 72px; height: 72px; object-fit: cover; display: block; border: 1px solid var(--border); border-radius: 6px; }

.lightbox { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(20, 20, 20, .95); touch-action: pan-y; }
.lightbox[open] { display: flex; }
.lightbox img { max-width: 100vw; max-height: 100dvh; object-fit: contain; }
.lightbox button { position: absolute; border: 0; background: rgba(255, 255, 255, .15); color: #fff; border-radius: 50%; cursor: pointer; font-size: 1.2rem; line-height: 1; }
.lightbox .close { top: calc(12px + env(safe-area-inset-top)); right: 12px; width: 40px; height: 40px; }
.lightbox .prev, .lightbox .next { top: 50%; transform: translateY(-50%); width: 44px; height: 44px; }
.lightbox .prev { left: 10px; }
.lightbox .next { right: 10px; }
.lightbox .count { position: absolute; bottom: calc(16px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); color: rgba(255, 255, 255, .8); font-size: 13px; }
.lightbox[data-single="1"] .prev, .lightbox[data-single="1"] .next, .lightbox[data-single="1"] .count { display: none; }
</style>
</head>
<body>
<div class="page">
{{UPDATED}}
<h1>{{H1}}</h1>
<main>
{{BODY}}
</main>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="写真">
<img id="lb-img" alt="">
<button class="close" type="button" aria-label="閉じる">✕</button>
<button class="prev" type="button" aria-label="前の写真">‹</button>
<button class="next" type="button" aria-label="次の写真">›</button>
<span class="count" id="lb-count"></span>
</div>

<script>
const MEDIA = {{LIGHTBOX_DATA}};
const box = document.getElementById('lightbox');
const boxImg = document.getElementById('lb-img');
const boxCount = document.getElementById('lb-count');
let shots = [];
let cursor = 0;

function show(i) {
  cursor = (i + shots.length) % shots.length;
  const shot = shots[cursor];
  boxImg.src = shot.src;
  boxImg.width = shot.w;
  boxImg.height = shot.h;
  boxCount.textContent = `${cursor + 1} / ${shots.length}`;
}

function openBox(postId, index) {
  shots = MEDIA[postId] || [];
  if (!shots.length) return;
  box.dataset.single = shots.length === 1 ? '1' : '0';
  box.setAttribute('open', '');
  document.body.style.overflow = 'hidden';
  show(index);
}

function closeBox() {
  box.removeAttribute('open');
  document.body.style.overflow = '';
  boxImg.removeAttribute('src');
}

document.addEventListener('click', (e) => {
  const shot = e.target.closest('.shot');
  if (shot) openBox(shot.dataset.post, Number(shot.dataset.index));
});

box.addEventListener('click', (e) => {
  const button = e.target.closest('button');
  if (!button) { closeBox(); return; }
  if (button.classList.contains('close')) closeBox();
  if (button.classList.contains('prev')) show(cursor - 1);
  if (button.classList.contains('next')) show(cursor + 1);
});

document.addEventListener('keydown', (e) => {
  if (!box.hasAttribute('open')) return;
  if (e.key === 'Escape') closeBox();
  if (e.key === 'ArrowLeft') show(cursor - 1);
  if (e.key === 'ArrowRight') show(cursor + 1);
});

let touchStartX = 0;
box.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
box.addEventListener('touchend', (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) show(cursor + (dx < 0 ? 1 : -1));
}, { passive: true });
</script>
</body>
</html>
